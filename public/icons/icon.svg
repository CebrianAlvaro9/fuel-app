<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#141414"/>

  <!--
    Logo: la "G" de Gasolinera y el surtidor, a la misma altura de caja.
    La letra va dibujada como trazo y no con texto: una fuente dependería de lo
    que tenga instalado cada máquina y el icono saldría distinto en cada una.
    El bloque mide 32.4 x 16 y se escala centrado.
  -->
  <g transform="translate(91 175) scale(10.2)">
    <!-- G: arco casi completo con el hueco arriba a la derecha, y el espolón
         entrando por el centro. -->
    <path d="M11.2 3.4 A5.9 5.9 0 1 0 13.9 8 L9.4 8"
          fill="none" stroke="#ffffff" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Surtidor, en sus coordenadas originales y reescalado a la caja de la G -->
    <g transform="translate(18 0) scale(0.8) translate(-2.6 -2)">
      <g fill="#ffffff">
        <rect x="2.6" y="19.4" width="12.8" height="2.6" rx="1.3"/>
        <rect x="4.4" y="2" width="9.2" height="16.8" rx="2.2"/>
      </g>

      <!-- Ventana: recorte en el color del fondo -->
      <rect x="6.4" y="4.4" width="5.2" height="4.2" rx="1" fill="#141414"/>

      <!-- Manguera con trazo grueso, para que no se empaste a tamaño favicon -->
      <path d="M13.6 9h2.4a1.7 1.7 0 0 1 1.7 1.7v4a1.35 1.35 0 0 0 2.7 0V9.2"
            fill="none" stroke="#ffffff" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
