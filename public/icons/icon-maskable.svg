<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo a sangre: el sistema operativo aplica su propia máscara. -->
  <rect width="512" height="512" fill="#141414"/>

  <!--
    Mismo logo, algo más pequeño para caber en la zona segura (círculo del 80%).
